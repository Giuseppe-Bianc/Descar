[workspace]
resolver = "3"
members = [
    "crates/descar-core",
    "crates/descar-cli",
    "crates/descar",
]

[workspace.dependencies]
insta = { version = "1.48.0", features = ["yaml", "redactions", "filters"] }
clap = { version = "4.6.6", features = ["cargo", "derive"] }
thiserror = "2.0.20"
console = "0.16.4"
regex = "1.13.1"

[workspace.lints.clippy]
pedantic = "warn"
nursery = "warn"
# Performance
inefficient_to_string = "warn"


[profile.dev.package]
insta.opt-level = 3
similar.opt-level = 3